name: "Compatibilité ascendante"

on:
  pull_request:

jobs:
  bc-check:
    name: "Roave BC check"
    runs-on: "ubuntu-latest"
    # Bloquant depuis la 1.0.0 : toute rupture de compatibilité doit attendre une version majeure.
    steps:
      - uses: "actions/checkout@v5"
        with:
          fetch-depth: 0
      - uses: "shivammathur/setup-php@v2"
        with:
          php-version: "8.4"
          coverage: "none"
          ini-values: "memory_limit=-1"
          tools: "composer:v2, roave/backward-compatibility-check"
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
      # --install-development-dependencies : les interfaces PSR seulement suggérées (psr/http-server-middleware,
      # psr/http-factory) sont en require-dev ; sans elles, RoutingMiddleware ne peut pas être analysé.
      - run: "roave-backward-compatibility-check --from=${{ github.event.pull_request.base.sha }} --install-development-dependencies --format=github-actions"
